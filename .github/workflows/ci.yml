name: portfolio_ci

on:
  push:
  pull_request:

jobs:
  python_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml python-json-logger
      - name: Validate Python syntax
        run: python -m compileall shared tests
      - name: Run tests
        run: pytest -q
