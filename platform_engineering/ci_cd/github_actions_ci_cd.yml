# CI/CD pipeline: lint -> test -> security scan -> build -> (deploy on main).
#
# Design principle: every stage after "lint" only runs if the previous
# stage passed, and the pipeline fails fast on the cheapest checks first
# (lint takes seconds; a full test suite takes longer; a container build
# takes longer still), so a broken PR gets feedback in seconds, not
# minutes, for the most common mistakes.
#
# HONESTY NOTE: syntax-reviewed, standard GitHub Actions workflow syntax.
# Has not been run in an actual GitHub Actions runner in this environment,
# since that requires a real GitHub repository and Actions runner
# infrastructure this development environment doesn't have.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install ruff black
      - name: Run ruff (fast Python linter)
        run: ruff check .
      - name: Check formatting with black
        run: black --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against the range of Python versions the platform
        # actually supports in production, not just whatever the
        # developer's laptop happens to have installed.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run test suite with coverage
        run: pytest --cov=src --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  security_scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
      - name: Scan for accidentally committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    needs: [test, security_scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform_engineering/docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/risk-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires manual approval via GitHub Environment protection rules
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "kubectl set image deployment/risk-pipeline-consumer \
            risk-pipeline-consumer=ghcr.io/${{ github.repository }}/risk-pipeline:${{ github.sha }} \
            -n data-platform"
          # Real deployment step would authenticate to the cluster here
          # (e.g. via azure/k8s-set-context or aws-actions/amazon-eks) and
          # run the actual kubectl/helm command. Left as an illustrative
          # echo here since no real cluster credentials exist for this
          # portfolio project.
