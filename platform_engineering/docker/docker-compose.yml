# Local development stack: Kafka + Zookeeper for the streaming pipeline,
# plus the pipeline service itself. This is the "docker compose up" that
# lets a new engineer get a working local environment in one command
# instead of a wiki page of manual setup steps.
#
# HONESTY NOTE: syntax-reviewed, standard Compose v3.8 format using the
# official Confluent Kafka images. Not run against a live Docker daemon
# in this environment.

version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  risk_pipeline:
    build:
      context: ../../projects/shared_event_streaming/kafka_snowflake_risk_pipeline
      dockerfile: ../../../platform_engineering/docker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: INFO
    restart: unless-stopped

networks:
  default:
    name: data_platform_local_dev
