apiVersion: v1
kind: ConfigMap
metadata:
  name: risk-pipeline-config
  namespace: data-platform
data:
  kafka_bootstrap_servers: "kafka-broker.data-platform.svc.cluster.local:9092"
  log_level: "INFO"
  metrics_namespace: "data_platform"

---
# TEMPLATE ONLY -- do not commit real secret values to source control.
# In production, secrets should be populated via a secrets manager
# integration (AWS Secrets Manager + External Secrets Operator, or
# Azure Key Vault CSI driver), not applied directly with real values in
# a YAML file, even in a private repo.
apiVersion: v1
kind: Secret
metadata:
  name: risk-pipeline-secrets
  namespace: data-platform
type: Opaque
stringData:
  snowflake_account: "<POPULATED_BY_SECRETS_MANAGER>"
  snowflake_password: "<POPULATED_BY_SECRETS_MANAGER>"
